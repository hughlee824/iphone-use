name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate pull request title
        run: python3 scripts/checks/check-pr-title.py --event "$GITHUB_EVENT_PATH"
      - name: Install Actionlint
        run: python3 scripts/tools/install-actionlint.py
      - name: Run portable checks
        run: python3 scripts/check.py --suite quick
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-plugins
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Explicit public paths below include .build/plugins.
          path: |
            .build/plugins/*.zip
            .build/plugins/*.zip.sha256
      - name: Prepare artifact transfer fixtures
        run: python3 scripts/checks/check-artifact-transfer.py prepare .build/artifact-transfer/source/.build/releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-transfer-fixture
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          path: |
            .build/artifact-transfer/source/.build/releases/*.tar.gz
            .build/artifact-transfer/source/.build/releases/*.tar.gz.sha256
            .build/artifact-transfer/source/.build/releases/iphone-use.rb
            .build/artifact-transfer/source/.build/releases/*.zip
            .build/artifact-transfer/source/.build/releases/*.zip.sha256
  artifact-transfer:
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-transfer-fixture
          path: ${{ runner.temp }}/release-transfer-download
          digest-mismatch: error
          skip-decompress: false
      - name: Verify transferred files independently of the upload
        run: python3 scripts/checks/check-artifact-transfer.py verify "$RUNNER_TEMP/release-transfer-download"
  native:
    needs: quick
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Match the validated SDK and the image's iOS 27 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Report build toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install SwiftLint
        run: python3 scripts/tools/install-swiftlint.py
      - name: Run shared engineering checks
        run: python3 scripts/check.py --suite native
      - name: Verify brand toolchain and reproducible assets
        run: |
          npm ci --prefix scripts/brand --ignore-scripts
          python3 -m venv .build/brand-venv
          .build/brand-venv/bin/python -m pip install -r scripts/brand/requirements.txt
          .build/brand-venv/bin/python scripts/brand/check.py
  test:
    # Keep the protected status name and fail even when an upstream job was skipped.
    if: always()
    needs: [quick, native, artifact-transfer]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check group
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-transfer.result }}
        run: test "$QUICK_RESULT" = success && test "$NATIVE_RESULT" = success && test "$ARTIFACT_RESULT" = success
